version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: movie_rcm_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - springboot
      - fastapi
    networks:
      - movie_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        SPRINGBOOT_INTERNAL_URL: http://springboot:8080
    container_name: movie_rcm_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_SPRINGBOOT_API_URL=/api
      - MODEL_API_URL=http://fastapi:8000/api/chat
    expose:
      - "3000"
    networks:
      - movie_network

  springboot:
    build:
      context: ../backend/springboot
      dockerfile: Dockerfile
    container_name: movie_rcm_springboot
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-movie_rcm_db}}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-${POSTGRES_USER:-postgres}}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - APP_CATALOG_SYNC_URL=http://fastapi:8000/api/index/sync
      - CATALOG_SYNC_TOKEN=${CATALOG_SYNC_TOKEN:-}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - movie_network

  fastapi:
    build:
      context: ../backend/fastapi
      dockerfile: Dockerfile
    container_name: movie_rcm_fastapi
    restart: always
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - MODEL_MODE=${MODEL_MODE:-light}
      - TEXT_ENCODER_PATH=${TEXT_ENCODER_PATH:-}
      - RERANKER_MODEL_PATH=${RERANKER_MODEL_PATH:-}
      - SCORE_CALIBRATION_PATH=${SCORE_CALIBRATION_PATH:-}
      - LLAMA_SERVER_URL=${LLAMA_SERVER_URL:-http://host.docker.internal:8081/v1}
      - LLM_MODEL=${LLM_MODEL:-Qwen3-4B-GGUF}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - SYNC_STATE_PATH=/app/data/indices/catalog_sync_state.json
      - EMBEDDING_CACHE_DIR=/app/data/indices/text
      - CATALOG_SYNC_TOKEN=${CATALOG_SYNC_TOKEN:-}
    volumes:
      - ../ai/models:/app/models:ro
      - ../data/indices:/app/data/indices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    expose:
      - "8000"
    networks:
      - movie_network

  postgres:
    image: postgres:16-alpine
    container_name: movie_rcm_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movie_rcm_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/schema/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-movie_rcm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - movie_network

  redis:
    image: redis:7-alpine
    container_name: movie_rcm_redis
    restart: always
    expose:
      - "6379"
    networks:
      - movie_network

networks:
  movie_network:
    driver: bridge

volumes:
  pgdata:
