version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: movie_rcm_postgres
    environment:
      POSTGRES_DB: movie_rcm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: movie_rcm_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
