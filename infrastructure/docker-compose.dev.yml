# =========================================================================
# Local Development Opt-In Override (docker-compose.dev.yml)
# Mounts demo seeds and provides local developer defaults.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# =========================================================================

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - ../database/seeds/01_seed_movies.sql:/docker-entrypoint-initdb.d/02_seed_movies.sql:ro
      - ../database/seeds/02_seed_50_users.sql:/docker-entrypoint-initdb.d/03_seed_50_users.sql:ro

  springboot:
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-password}
      - APP_JWT_SECRET=${APP_JWT_SECRET:-dev_jwt_secret_key_must_be_at_least_256_bits_for_hmac_sha256}
