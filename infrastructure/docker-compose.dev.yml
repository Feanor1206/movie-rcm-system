# =========================================================================
# Local Development Opt-In Override (docker-compose.dev.yml)
# Mounts demo seeds and provides local developer defaults for MySQL 8.0.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# =========================================================================

services:
  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${MYSQL_PASSWORD:-password}}
    volumes:
      - ../database/seeds/01_seed_movies.sql:/docker-entrypoint-initdb.d/02_seed_movies.sql:ro
      - ../database/seeds/02_seed_50_users.sql:/docker-entrypoint-initdb.d/03_seed_50_users.sql:ro

  springboot:
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-${MYSQL_PASSWORD:-password}}
      - APP_JWT_SECRET=${APP_JWT_SECRET:?APP_JWT_SECRET required}

  fastapi:
    environment:
      - APP_DEMO_MODE=true
