name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop", "dev", "chore/taicautruc" ]
  pull_request:
    branches: [ "main", "master", "develop", "dev", "chore/taicautruc" ]

jobs:
  frontend-check:
    name: Frontend Verification & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript Check
        run: npm run typecheck
      - name: Frontend Behavioral Test Suites
        run: npm test
      - name: Animation Catalog Baseline Check
        run: node ../scripts/preview_animation_catalog.cjs --test
      - name: Production Next.js Build
        run: npm run build
      - name: Verify Route JS Budgets (<=140 KiB)
        run: node ../scripts/compute_build_bytes.cjs

  backend-check:
    name: Spring Boot Tests & Policy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/springboot
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw
      - name: Run Spring Boot Unit & Integration Tests
        run: ./mvnw test -Dspring.profiles.active=test

  fastapi-check:
    name: FastAPI Offline Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/fastapi
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'fastapi>=0.110.0' 'pydantic>=2.6.0' 'python-dotenv>=1.0.1' 'httpx>=0.27.0' 'pytest>=8.0.0' 'jsonschema>=4.0.0' 'transformers>=4.40.0' 'peft>=0.11.0' 'accelerate>=0.29.0'
      - name: Run offline tests
        working-directory: .
        run: python -m pytest -q tests backend/fastapi/tests
