name: CI Pipeline

on:
  push:
    branches: [ "main", "dev", "java-main", "python-main" ]
  pull_request:
    branches: [ "main", "dev", "java-main", "python-main" ]

jobs:
  frontend-check:
    name: Frontend Verification & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript Check
        run: npm run typecheck
      - name: Frontend Behavioral Test Suites
        run: npm test
      - name: Animation Catalog Baseline Check
        run: node ../scripts/preview_animation_catalog.cjs --test
      - name: Build web assets
        run: npm run build
      - name: Verify Route JS Budgets (<=140 KiB)
        run: node ../scripts/compute_build_bytes.cjs

  fastapi-check:
    name: FastAPI & AI v4 Offline Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/fastapi
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-test.txt
      - name: Run offline tests
        working-directory: .
        run: python -m pytest -q tests backend/fastapi/tests
