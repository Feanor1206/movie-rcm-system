name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop", "dev", "chore/taicautruc" ]
  pull_request:
    branches: [ "main", "master", "develop", "dev", "chore/taicautruc" ]

jobs:
  frontend-check:
    name: Frontend Verification & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript Check
        run: npx tsc --noEmit
      - name: Frontend Behavioral Test Suites
        run: npm test
      - name: Animation Catalog Baseline Check
        run: node ../scripts/preview_animation_catalog.cjs --test
      - name: Production Next.js Build
        run: npm run build
      - name: Verify Route JS Budgets (<=140 KiB)
        run: node ../scripts/compute_build_bytes.cjs

  backend-check:
    name: Spring Boot Tests & Policy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/springboot
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw
      - name: Run Spring Boot Unit & Integration Tests
        run: ./mvnw test -Dspring.profiles.active=test
